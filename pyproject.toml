
[build-system]
requires = ["setuptools>=68", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad"
version = "0.1.0"
description = "A lightweight automatic differentiation library powered by C and Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cffi>=1.15"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minigrad = ["*.so", "*.dylib", "*.dll"]
